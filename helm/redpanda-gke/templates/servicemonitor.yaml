{{- if and .Values.monitoring.enabled .Values.monitoring.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "redpanda-gke.fullname" . }}
  namespace: {{ include "redpanda-gke.namespace" . }}
  labels:
    {{- include "redpanda-gke.labels" . | nindent 4 }}
    {{- with .Values.monitoring.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "redpanda-gke.selectorLabels" . | nindent 6 }}
  endpoints:
    - port: admin
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.monitoring.serviceMonitor.scrapeTimeout }}
  namespaceSelector:
    matchNames:
      - {{ include "redpanda-gke.namespace" . }}
{{- end }}
---
{{- if .Values.monitoring.enabled }}
# Additional monitoring service for Prometheus scraping
apiVersion: v1
kind: Service
metadata:
  name: {{ include "redpanda-gke.fullname" . }}-metrics
  namespace: {{ include "redpanda-gke.namespace" . }}
  labels:
    {{- include "redpanda-gke.labels" . | nindent 4 }}
  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/port: "{{ .Values.service.adminPort }}"
    prometheus.io/path: "/metrics"
spec:
  type: ClusterIP
  selector:
    {{- include "redpanda-gke.selectorLabels" . | nindent 4 }}
  ports:
    - name: metrics
      port: {{ .Values.service.adminPort }}
      targetPort: {{ .Values.service.adminPort }}
      protocol: TCP
{{- end }}
