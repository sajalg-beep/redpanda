{{- if .Values.rbac.create }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "redpanda-gke.fullname" . }}
  namespace: {{ include "redpanda-gke.namespace" . }}
  labels:
    {{- include "redpanda-gke.labels" . | nindent 4 }}
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - services
      - endpoints
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "redpanda-gke.fullname" . }}
  namespace: {{ include "redpanda-gke.namespace" . }}
  labels:
    {{- include "redpanda-gke.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "redpanda-gke.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "redpanda-gke.serviceAccountName" . }}
    namespace: {{ include "redpanda-gke.namespace" . }}
{{- end }}
