---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: redpanda
  namespace: redpanda
  labels:
    app: redpanda
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: redpanda
  namespace: redpanda
  labels:
    app: redpanda
rules:
  - apiGroups:
      - ""
    resources:
      - pods
      - services
      - endpoints
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - ""
    resources:
      - configmaps
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: redpanda
  namespace: redpanda
  labels:
    app: redpanda
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: redpanda
subjects:
  - kind: ServiceAccount
    name: redpanda
    namespace: redpanda
