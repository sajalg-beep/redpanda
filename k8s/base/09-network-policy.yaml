---
# Network policy for additional security (optional)
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: redpanda-network-policy
  namespace: redpanda
  labels:
    app: redpanda
spec:
  podSelector:
    matchLabels:
      app: redpanda
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # Allow inter-broker communication
    - from:
        - podSelector:
            matchLabels:
              app: redpanda
      ports:
        - protocol: TCP
          port: 33145
        - protocol: TCP
          port: 9092
    # Allow external Kafka access
    - from: []
      ports:
        - protocol: TCP
          port: 9094
    # Allow admin/monitoring access
    - from: []
      ports:
        - protocol: TCP
          port: 9644
        - protocol: TCP
          port: 8081
        - protocol: TCP
          port: 8082
  egress:
    # Allow all egress traffic
    - to:
        - podSelector: {}
    # Allow DNS
    - to:
        - namespaceSelector:
            matchLabels:
              name: kube-system
      ports:
        - protocol: UDP
          port: 53
    # Allow external communication
    - to:
        - namespaceSelector: {}
