---
# Horizontal Pod Autoscaler (optional - for dynamic scaling)
# Note: StatefulSets with HPA require careful consideration
# This is provided as a template but may need customization
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: redpanda-hpa
  namespace: redpanda
  labels:
    app: redpanda
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: StatefulSet
    name: redpanda
  minReplicas: 3
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 180
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
