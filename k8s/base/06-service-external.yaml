---
# External LoadBalancer service for Redpanda broker 0
apiVersion: v1
kind: Service
metadata:
  name: redpanda-0-external
  namespace: redpanda
  labels:
    app: redpanda
    broker: "0"
  annotations:
    # GKE external LoadBalancer annotations
    cloud.google.com/load-balancer-type: "External"
    # Optional: Reserve a static IP for predictable external IPs
    # networking.gke.io/load-balancer-ip-addresses: "redpanda-0-ip"
spec:
  type: LoadBalancer
  externalTrafficPolicy: Local
  selector:
    app: redpanda
    statefulset.kubernetes.io/pod-name: redpanda-0
  ports:
    - name: kafka-external
      port: 9094
      targetPort: 9094
      protocol: TCP
    - name: admin
      port: 9644
      targetPort: 9644
      protocol: TCP
    - name: schema-registry
      port: 8081
      targetPort: 8081
      protocol: TCP
