# Kafka client configuration for external access to Redpanda
# Replace example.com with your actual domain

# Bootstrap servers (external LoadBalancers)
bootstrap.servers=redpanda-0.example.com:9094,redpanda-1.example.com:9094,redpanda-2.example.com:9094

# Client configuration
client.id=redpanda-external-client

# Producer configuration
acks=all
retries=3
max.in.flight.requests.per.connection=5
compression.type=snappy
linger.ms=10
batch.size=16384

# Consumer configuration
group.id=external-consumer-group
auto.offset.reset=earliest
enable.auto.commit=true
auto.commit.interval.ms=5000
session.timeout.ms=30000
max.poll.records=500

# Security configuration (uncomment if using TLS/SASL)
# security.protocol=SASL_SSL
# sasl.mechanism=SCRAM-SHA-256
# sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required username="user" password="password";
# ssl.truststore.location=/path/to/truststore.jks
# ssl.truststore.password=truststore-password
